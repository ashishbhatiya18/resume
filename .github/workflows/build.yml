name: Build Resume

on:
  push:
    branches: [main, master]
    paths:
      - "resume.json"
      - "package.json"
      - "theme/**"
      - "scripts/**"
      - ".github/workflows/build.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate resume.json against JSON Resume schema
        # resume.json intentionally adds a non-standard top-level `coreCompetencies`
        # field for this theme, so schema validation is informational, not blocking.
        run: npx resumed validate resume.json || true

      - name: Build resume.pdf
        run: npm run build

      - name: Rename output to Ashish_Bhatiya-Resume.pdf
        run: cp resume.pdf Ashish_Bhatiya-Resume.pdf

      - name: Upload resume artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ashish_Bhatiya-Resume
          path: Ashish_Bhatiya-Resume.pdf
          if-no-files-found: error

      - name: Publish resume as a GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest resume build
          body: Automatically rebuilt from ${{ github.sha }}. This release is overwritten on every push.
          files: Ashish_Bhatiya-Resume.pdf
